name: Backend CD

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies & Test
        run: |
          cd starter/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install Pipfile || true
          pip install pytest
          pytest test_app.py || python -m unittest discover || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/backend
          docker build -t $ECR_REGISTRY/backend:$IMAGE_TAG -t $ECR_REGISTRY/backend:latest .
          docker push $ECR_REGISTRY/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/backend:latest

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${ECR_REGISTRY}/backend:${IMAGE_TAG}|g" starter/backend/k8s/deployment.yaml || true
          kubectl apply -f starter/backend/k8s/
